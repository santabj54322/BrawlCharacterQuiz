<script>
  const grid = document.querySelector(".character-grid");
for (let i = 1; i <= 106; i++) {
  const character = document.createElement("div");

  character.className = "character";
  character.dataset.number = i;

  if (i === 1) {
  character.classList.add("starter");
} else if (i >= 2 && i <= 9) {
  character.classList.add("rare");
} else if (i >= 10 && i <= 19) {
  character.classList.add("superrare");
} else if (i >= 20 && i <= 49) {
  character.classList.add("epic");
} else if (i >= 50 && i <= 90) {
  character.classList.add("mythic");
} else if (i >= 91 && i <= 104) {
  character.classList.add("legendary");
} else if (i >= 105 && i <= 106) {
  character.classList.add("ultralegendary");
}

  const number = String(i).padStart(3, "0");

  character.innerHTML = `
    <span class="number">${number}</span>
    <img src="images/question.jpg.png">
  `;

  grid.appendChild(character);
}

</script>

  let seconds = 0;
let timerId = null;
let timerStarted = false;

function startTimer() {
  if (timerStarted) return;

  timerStarted = true;

  timerId = setInterval(function () {
    seconds++;

    const minutes = Math.floor(seconds / 60);
    const secs = seconds % 60;

    document.getElementById("timer").textContent =
      String(minutes).padStart(2, "0") + ":" +
      String(secs).padStart(2, "0");
  }, 1000);
}

function stopTimer() {
  clearInterval(timerId);
}

const answered = [];

function hiraganaToKatakana(str) {
  return str.replace(/[\u3041-\u3096]/g, function(match) {
    return String.fromCharCode(match.charCodeAt(0) + 0x60);
  });
}

function checkAnswer() {
  const input = document.getElementById("answer");
  const name = hiraganaToKatakana(input.value.trim());

  const characterEntry = Object.entries(characters).find(([key, data]) => {
    return key === name || (data.aliases && data.aliases.includes(name));
  });

  if (characterEntry && !answered.includes(characterEntry[0])) {
    input.value = "";
    answered.push(characterEntry[0]);

    if (answered.length === 1) {
      startTimer();
    }

    document.getElementById("count").textContent = answered.length;
    document.getElementById("remaining").textContent = 106 - answered.length;

    if (soundEnabled) {
      new Audio("sounds/ピック音.mp3").play();
    }

    const character = characterEntry[1];
    const targetBox = document.querySelector(
      `.character[data-number="${character.number}"]`
    );

    if (targetBox) {
      targetBox.classList.add("answered");

      const targetImage = targetBox.querySelector("img");

      if (targetImage) {
        targetImage.src = character.image;
      }

      let nameLabel = targetBox.querySelector(".character-name");

      if (!nameLabel) {
        nameLabel = document.createElement("div");
        nameLabel.className = "character-name";
        targetBox.appendChild(nameLabel);
      }

      nameLabel.textContent = characterEntry[0];
    }

    if (answered.length === 106) {
      stopTimer();

      document.getElementById("clearTime").textContent =
        document.getElementById("timer").textContent;

      document.getElementById("clearCount").textContent = "106 / 106 ";

      const clearComments = [
        "캐릭터 지식만 프로 랭크",
        "한가한!",
        "진짜 대단하다!",
        "이 정도면 브롤스타즈 운영진 해도 되겠다",
        "공부하러 가"
      ];

      const randomComment =
        clearComments[Math.floor(Math.random() * clearComments.length)];

      document.getElementById("clearComment").textContent = randomComment;

      document.getElementById("clearMessage").style.display = "block";
    }

  } else if (characterEntry && answered.includes(characterEntry[0])) {
    if (soundEnabled) {
      new Audio("sounds/ミス.mp3").play();
    }
    input.value = "";

  } else {
    if (soundEnabled) {
      new Audio("sounds/失敗.mp3").play();
    }
    input.value = "";
  }
}

document.getElementById("answer").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    checkAnswer();
  }
});

function closeClear() {
  document.getElementById("clearMessage").style.display = "none";
}

  location.reload();

function confirmGiveUp() {
  const result = confirm("정말 포기하시겠습니까?");

  if (result) {
    giveUp();
  }
}

function giveUp() {
  stopTimer();

  Object.entries(characters).forEach(([name, character]) => {
    const targetBox = document.querySelector(
      `.character[data-number="${character.number}"]`
    );

    const giveUpComments = [
      "다음엔 더 많이 맞힐 수 있어!",
      "맨날 포기만 하며 살 거냐",
      "아직 멀었네",
      "벌써 끝내는 거야? 아깝다!",
      "여기서 포기해 버리네 ㅋ"
    ];

    const randomGiveUpComment =
      giveUpComments[Math.floor(Math.random() * giveUpComments.length)];

    document.getElementById("giveUpComment").textContent =
      randomGiveUpComment;

    if (targetBox) {
      const targetSlot = targetBox.querySelector("img");

      targetSlot.src = character.image;
      targetBox.classList.add("answered");

      let nameLabel = targetBox.querySelector(".character-name");

      if (!nameLabel) {
        nameLabel = document.createElement("div");
        nameLabel.className = "character-name";
        targetBox.appendChild(nameLabel);
      }

      nameLabel.textContent = name;

      if (!answered.includes(name)) {
        targetSlot.style.filter = "grayscale(100%)";
        targetSlot.style.opacity = "0.55";
      }
    }
  });

  document.getElementById("answer").disabled = true;
  document.getElementById("giveUpButton").disabled = true;

  document.getElementById("giveUpCount").textContent = answered.length;
  document.getElementById("giveUpTime").textContent =
    document.getElementById("timer").textContent;

  document.getElementById("giveUpMessage").style.display = "block";
}

function closeGiveUp() {
  document.getElementById("giveUpMessage").style.display = "none";
}

function shareToX() {
  const count = answered.length;
  const time = document.getElementById("timer").textContent;

  const text =
`모든 브롤러를 말할 수 있을까?
${count} / 106명 정답!
시간: ${time}

#모든브롤러를말할수있을까`;

  const url =
    "https://twitter.com/intent/tweet?text=" +
    encodeURIComponent(text);

  window.open(url, "_blank");
}

let soundEnabled = true;

const soundOnBtn = document.getElementById("soundOnBtn");
const soundOffBtn = document.getElementById("soundOffBtn");

function updateSoundButtons() {
  soundOnBtn.classList.toggle("active", soundEnabled);
  soundOffBtn.classList.toggle("active", !soundEnabled);
}

soundOnBtn.addEventListener("click", function () {
  soundEnabled = true;
  updateSoundButtons();
});

soundOffBtn.addEventListener("click", function () {
  soundEnabled = false;
  updateSoundButtons();
});

updateSoundButtons();
